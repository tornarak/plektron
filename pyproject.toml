[project]
name = "machine-press"
version = "0.1.0"
description = "Bogoras, The Chukchee — annotated digital edition"
requires-python = ">=3.14"
dependencies = [
    "chocomufin>=1.0.2",
    "kraken>=7.0.3",
    "lxml>=6.1.1",
    "tensorboard>=2.21.0",
    "toon-format>=0.9.0b1",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
