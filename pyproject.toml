[project]
name = "plektron"
version = "0.1.0"
description = "Bogoras, The Chukchee — annotated digital edition"
requires-python = ">=3.14"
dependencies = [
    "chocomufin>=1.0.2",
    # **Declared because the CLI is built on them**, not because either is new to
    # the environment — both arrive transitively through kraken, and did before
    # anything here imported them. `click` is the parser (`harness/cli/`); `rich`
    # renders the aligned tables and the progress bars (`harness/render.py`). The
    # same argument as numpy and pillow below: a kraken release that dropped
    # either would break this package with an ImportError naming neither it nor
    # the reason.
    "click>=8.2",
    "rich>=14.0",
    "kraken>=7.0.3",
    "lxml>=6.1.1",
    # **Declared because the harness imports them directly**, not because anything
    # new needs them. `numpy` is imported at ten sites across `lines.py` and
    # `zones.py` (the ink mask, the row bands, the column anchor) and `pillow` at a
    # dozen more; both were reaching us only as transitive dependencies of kraken,
    # so a kraken release that dropped either would have broken the harness with an
    # ImportError that named neither this project nor the reason. Found by `ty`,
    # which could not type an array it had no declared package for.
    "numpy>=2.4",
    "pillow>=11.0",
    "tensorboard>=2.21.0",
    "toon-format>=0.9.0b1",
    "cloup>=3.1.0",
    # **The Russian morphological dictionary**, for the lexicon check over the
    # gloss column of the annexed dictionaries (Moll & Inenlikej 1957 first).
    # The asymmetry it exploits is the one the English `lexicon_miss` detector
    # rests on: Russian has a dictionary and Chukchi does not, so a misread
    # gloss word is catchable by one reader plus a wordlist where a misread
    # headword needs two independent readers. Declared rather than supplied by
    # `uv run --with` because the check is part of the pass now, and a check
    # that only runs when someone remembers a flag is not a gate on anything.
    "pymorphy3>=2.0",
    # **The web layer** (`harness/web/`), which the four browser editors and the
    # reading view are served from. `fastapi` is the router and, through
    # pydantic, the declared shape of every POST body — the editors' saves were
    # dicts dug out of `json.loads` by hand. `uvicorn` is the ASGI server, and
    # the multi-socket form of its `serve()` is load-bearing rather than
    # incidental: one process listens on all four editors' ports, which is what
    # lets them share a template tree and cross-link.
    #
    # `starlette`, `pydantic` and `anyio` arrive through fastapi and are
    # deliberately **not** declared — they are fastapi's interface, not ours,
    # and pinning them here would be asserting a compatibility we do not test.
    "fastapi>=0.120",
    "uvicorn>=0.38",
    # Declared for the reason `numpy` and `pillow` are, one paragraph up: it was
    # already here transitively, and the harness now imports it directly, so a
    # release that dropped it would break this package with an ImportError
    # naming neither it nor the reason.
    "jinja2>=3.1",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
# `harness/tests/` sits inside the package so a test lives beside what it covers,
# but it is not part of what `harness` ships — and its fixtures reach for the repo
# (`Path(__file__).parent.parent.parent`), which does not exist in an installed tree.
exclude = ["harness/tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
    # `starlette.testclient.TestClient` is built on it. Dev-only because the
    # tests are the only caller: the web layer serves requests, it does not make
    # them. This is what replaced standing a real server up on a real port and
    # polling it — see `harness/tests/test_web_shell.py`.
    #
    # **`httpx2`, not `httpx`.** Starlette 1.6 deprecates the latter for the test
    # client and says so on every import. Taking the warning on a dependency
    # added today would be inheriting a migration we can simply not need.
    "httpx2>=2.9",
]

# ---------------------------------------------------------------------- ruff
#
# `uv run ruff check harness/ tools/` — a gate, and `harness/tests/test_lint.py`
# holds it to that.
#
# **The rule set is pinned explicitly and never inherited.** Ruff's default
# selection is documented as `E4,E7,E9,F` and is not: 0.16.1 additionally turns
# on flake8-bandit, flake8-implicit-str-concat and much of RUF, so a bare
# `ruff check` here reports 161 findings. A gate whose meaning changes when a dev
# dependency is upgraded is a gate nobody can act on, so `select` is a closed
# list and everything absent from it is absent on purpose.
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "C4", "I"]
ignore = [
    # `add = lambda name, **kw: act.add_parser(name, parents=[common], **kw)` is
    # the registration idiom in all seven `cli/` modules and is named as such in
    # `harness/README.md`. A `def` per module says the same thing in four lines.
    "E731",
]

# What is deliberately NOT selected, and why. Each was measured against the tree
# before being dropped — none is off because it was noisy in the abstract.
#
# RUF001/002/003 (ambiguous-unicode-character, 152 hits) — the sharpest case, and
#   it would be actively harmful. They flag characters that resemble ASCII, which
#   in this corpus is a description of the subject matter: `ˊ` U+02CA, `ɪ` U+026A,
#   `ᵋ` U+1D4B are inventory glyphs, not confusables. The project already has a
#   lookalike detector, and its whole design is that it is *scoped* — Tier-1 spans
#   only, `LOOKALIKE_GREPS` against `LOOKALIKE_CHARS`, held apart by
#   `test_lookalike_scope.py` because a consolidation was once nearly carried out
#   on an audit that mistook the difference for drift. An unscoped second detector
#   firing on the glyphs themselves would bury the real one.
# E501 (line-too-long) — `line-length` is set to 100 rather than 88 because the
#   prose in this package's docstrings is the documentation, wrapped to ~85. At 88
#   it reports 67 lines; at 100, three. Those three are fixed.
# ISC (implicit-str-concat, 17) — every hit is a CSS rule or a prose message
#   deliberately wrapped across lines. ISC004 is a good missing-comma detector in
#   general; here it is 17 false positives and nothing else.
# BLE001 (blind-except, 14) — the broad catches are deliberate fallbacks around
#   model loading and third-party IO, each with a message saying what it fell back
#   to.
# S (flake8-bandit) — `try/except/pass` around ref parsing is the idiom for "this
#   filename is not a page", not a swallowed error.
# PERF401 (17) / SIM — style, not correctness.
[tool.ruff.lint.per-file-ignores]
# Tests monkeypatch module attributes and bind loop variables they do not use, both
# of which are the point rather than an oversight.
"harness/tests/*" = ["B007"]

# ------------------------------------------------------------------------ ty
#
# `uv run ty check harness/` — **run by hand, and deliberately not a gate.**
#
# 71 diagnostics, down from 91 after one pass through them. What that pass found
# is recorded here because the residue looks like neglect and is not.
#
# **Fixed**: numpy and pillow were imported directly at 20+ sites and declared
# nowhere (see `dependencies` above); `@prev` on the first scan of a part reported
# "must name None"; a parameter rebound to a different type than its annotation;
# `Path = None` as a default; the legacy `Image.LANCZOS` aliases; two
# `log_message` overrides narrower than the base class; and two `min`-by-hand loops
# carrying a `None` through paired variables.
#
# **What remains is overwhelmingly not about this code.** `lxml` ships no stubs
# (22); the rest is `dict[str, str | int]` records whose values ty cannot narrow —
# `-r["n"]` where `n` is always an int — and tests subscripting a `X | None`
# return. Fixing those properly means TypedDicts through the record-passing layer,
# which is a real design change and not a lint fix.
#
# `lxml-stubs` was tried and removed: it trades 22 low-information warnings for
# ~30 `_Element | None` narrowing complaints, and every one sampled was already
# guarded in a way ty cannot see. It would need ~30 asserts through the XML code
# to buy nothing.
#
# Gating would mean permanent known-false failures or a suppression list long
# enough that a real finding lands in it unnoticed — and a check nobody can act on
# is worse than no check, because it reads as coverage. Revisit at `ty` 1.0.
[tool.ty.rules]
unresolved-import = "warn"
unresolved-attribute = "warn"
